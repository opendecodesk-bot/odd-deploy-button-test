<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Order shop</title>
<meta name="description" content="Order custom embroidered and decorated apparel. Each organization gets its own shop with its own colors and pricing.">
<meta property="og:title" content="Order shop">
<meta property="og:description" content="Order custom embroidered and decorated apparel. Each organization gets its own shop with its own colors and pricing.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas: #1B1D22;
    --card: #F6F3EC;
    --card-line: #DED8C8;
    --ink: #232323;
    --ink-soft: #6b6558;
    --cream-ink: #F6F3EC;
    --accent: #1E7A4C;
    --accent-dark: #123A24;
    --accent-soft: #E7F2EB;
    --radius: 2px;
    /* Passes WCAG AA (4.5:1) against both dark backgrounds used on this
       page (--canvas #1B1D22 and the ticket panel #151619). --ink-soft
       and the darker grays below were tuned for the light card
       background only and fail contrast when reused on dark ones. */
    --dim: #999999;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--canvas);
    color:var(--cream-ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{outline:2px solid #fff; outline-offset:3px;}

  /* ---- stitch signature ---- */
  .stitch{
    height:1px;
    background-image:linear-gradient(90deg, currentColor 0 6px, transparent 6px 12px);
    background-size:12px 1px;
    opacity:.55;
    border:none;
    margin:0;
  }
  .stitch-thick{
    height:2px;
    background-image:linear-gradient(90deg, currentColor 0 8px, transparent 8px 16px);
    background-size:16px 2px;
  }
  .needle-mark{display:inline-block; width:.5em;}

  /* ---- shell ---- */
  .shell{max-width:960px; margin:0 auto; padding:0 24px;}
  /* The storefront's 960px width is a deliberate reading-width choice for
     product copy + the 2-column cart layout — but the admin panel's order
     table has 13 columns and just needs more room, not narrower text. Only
     admin views get the wider shell (toggled in render(), index.html). */
  .shell.admin-wide{max-width:none; padding:0 16px;}
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:28px 0 18px 0;
  }
  .brand{font-family:'Fraunces', serif; font-weight:600; font-size:20px; letter-spacing:-0.01em;}
  .brand small{display:block; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:400; letter-spacing:.08em; text-transform:uppercase; opacity:.5; margin-top:2px;}
  .backlink{font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.04em; text-transform:uppercase; opacity:.7; text-decoration:none;}
  .backlink:hover{opacity:1;}

  /* ---- hub ---- */
  .hub-hero{padding:40px 0 8px 0;}
  .hub-hero h1{font-size:clamp(32px,5vw,48px); color:#fff; max-width:640px; line-height:1.05;}
  .hub-hero p{color:#a9a89e; max-width:480px; margin-top:14px; font-size:15px; line-height:1.6;}
  .tags{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:18px; padding:36px 0 60px 0;}
  .tag{
    position:relative;
    background:var(--card);
    color:var(--ink);
    border-radius:var(--radius);
    padding:22px 20px 20px 20px;
    text-decoration:none;
    display:block;
    transition:transform .15s ease;
  }
  .tag:hover{transform:translateY(-3px);}
  .tag::before{
    content:"";
    position:absolute; top:14px; right:16px;
    width:10px; height:10px; border-radius:50%;
    border:2px solid var(--org-accent, #1E7A4C);
  }
  .tag .org-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft);}
  .tag h3{font-size:21px; margin-top:6px; line-height:1.15; color:var(--ink);}
  .tag .status{
    margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft);
  }
  .tag .status.open{color:var(--org-accent,#1E7A4C); font-weight:600;}
  .tag .stitch{margin-top:14px; color:var(--ink-soft);}

  /* ---- org page ---- */
  .org-hero{padding:20px 0 30px 0; border-bottom:none;}
  .org-eyebrow-lg{font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:color-mix(in srgb, var(--org-accent) 65%, white 35%); font-weight:600;}
  .org-hero h1{font-size:clamp(30px,5vw,44px); color:#fff; margin-top:8px;}
  .org-hero .stitch{margin-top:18px; color:var(--org-accent);}
  .org-hero p.desc{color:#a9a89e; max-width:560px; margin-top:16px; font-size:15px; line-height:1.6;}

  .not-ready{
    background:var(--card); color:var(--ink); border-radius:var(--radius);
    padding:40px 32px; margin:24px 0 60px 0; text-align:left;
  }
  .not-ready .stitch{color:var(--org-accent); margin-bottom:18px;}
  .not-ready h2{font-size:22px;}
  .not-ready p{color:var(--ink-soft); font-size:14px; margin-top:10px; line-height:1.6;}

  .layout{display:grid; grid-template-columns:1.5fr 1fr; gap:0; margin:24px 0 60px 0;}
  @media(max-width:760px){.layout{grid-template-columns:1fr;}}

  .catalog{background:var(--card); color:var(--ink); border-radius:var(--radius) 0 0 var(--radius); padding:28px;}
  @media(max-width:760px){.catalog{border-radius:var(--radius) var(--radius) 0 0;}}
  .catalog h2:not(.cat-heading){font-size:12px; text-transform:uppercase; letter-spacing:.12em; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); margin-bottom:18px; font-weight:600;}

  .cat-nav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
  .cat-nav-link{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.1em; text-decoration:none;
    padding:5px 12px; border-radius:20px;
    border:1px solid var(--org-accent,var(--card-line)); color:var(--org-accent,var(--ink));
    transition:background .15s,color .15s;
  }
  .cat-nav-link:hover{background:var(--org-accent,var(--card-line)); color:var(--org-accent-ink,#fff);}

  .cat-section{margin-bottom:8px;}
  .cat-heading{
    font-family:'Fraunces',serif; font-size:22px; font-weight:700;
    color:var(--ink); letter-spacing:-0.01em;
    padding:24px 0 10px 0; border-bottom:3px solid var(--org-accent,var(--accent)); margin-bottom:0;
    scroll-margin-top:16px;
  }
  .cat-section:first-child .cat-heading{padding-top:0;}

  .product{border-top:1px solid var(--card-line); padding:20px 0;}
  .product:first-of-type{border-top:none; padding-top:0;}
  .product-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .product-head h3{font-size:18px;}
  .product-price{font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--org-accent); white-space:nowrap;}
  .product-desc{font-size:13px; color:var(--ink-soft); margin-top:4px; line-height:1.55; max-width:420px;}
  .feature-list{list-style:none; margin:8px 0 0 0; padding:0; display:flex; flex-direction:column; gap:3px;}
  .feature-list li{font-size:12px; color:var(--ink-soft); padding-left:14px; position:relative; line-height:1.5;}
  .feature-list li::before{content:"\2014"; position:absolute; left:0; color:var(--org-accent); font-size:11px;}

  .product-images{display:flex; gap:8px; margin-top:8px;}
  .product-images a{display:inline-block; line-height:0;}
  .product-images img{
    width:96px; height:96px; object-fit:contain; background:#fff;
    border:1px solid var(--card-line); border-radius:2px;
    transition:opacity .15s ease; cursor:zoom-in;
  }
  .product-images a:hover img{opacity:.85;}

  .design-preview{margin-bottom:8px;}
  .design-preview-imgs{display:flex; gap:12px; flex-wrap:wrap;}
  .design-preview-imgs a{display:inline-block; line-height:0;}
  .design-preview-imgs img{
    border-radius:2px; border:1px solid var(--card-line); background:#fff;
    height:150px; width:auto; object-fit:contain; transition:opacity .15s ease;
    cursor:zoom-in;
  }
  .design-preview-imgs a:hover img{opacity:.85;}
  .design-preview-caption{font-size:11px; color:var(--dim); margin-top:6px; font-family:'IBM Plex Mono',monospace;}
  .product-controls{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; align-items:center;}
  select, input[type=text], input[type=email], input[type=tel]{
    font-family:'IBM Plex Mono', monospace; font-size:13px;
    border:1px solid var(--card-line); background:#fff; color:var(--ink);
    padding:8px 10px; border-radius:var(--radius);
  }
  .qty-input{width:56px; text-align:center;}
  .add-btn{
    font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.06em;
    background:var(--org-accent); color:var(--org-accent-ink,#fff); border:none; padding:9px 16px; border-radius:var(--radius);
    font-weight:600;
  }
  .add-btn:hover{filter:brightness(1.08);}
  .stock-badge-wrap{display:block; margin-top:8px;}
  .stock-badge{display:inline-block; font-size:11px; font-weight:600; color:#166534; background:#dcfce7; border:1px solid #bbf7d0; border-radius:4px; padding:2px 8px; letter-spacing:.01em;}
  .personalize-row{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--ink-soft);}
  .personalize-row input[type=checkbox]{accent-color:var(--org-accent);}
  /* The customer's own design (migrations/0054): the upload box under a product or a location. */
  .cd-box{margin-top:10px; padding:10px; border:1px dashed #cfcabf; border-radius:8px; font-size:13px; color:var(--ink-soft);}
  .cd-box[hidden]{display:none;}
  .cd-head{font-weight:600; color:inherit; margin-bottom:6px;}
  .cd-file{display:block; max-width:100%; font-size:13px;}
  .cd-rules, .cd-hint{font-size:12px; margin-top:6px;}
  .cd-status{font-size:12px; margin-top:6px; min-height:1em; overflow-wrap:anywhere;}
  .cd-status.cd-err{color:#b42318;}
  .cd-status.cd-warn{color:#8a5a00;}
  .cd-preview{margin-top:6px;}
  .cd-preview a{display:inline-block; line-height:0;}
  .cd-preview img{max-width:120px; max-height:120px; object-fit:contain; border:1px solid #cfcabf; border-radius:8px; background:#fff; cursor:zoom-in;}
  .cart-line .l-desc .cd-cart{display:flex; align-items:center; gap:6px; overflow-wrap:anywhere;}
  .cart-line .l-desc .cd-cart img{width:32px; height:32px; object-fit:contain; border:1px solid #cfcabf; border-radius:4px; background:#fff; flex:none;}

  /* ---- ticket / cart panel ---- */
  .ticket{
    background:#151619; color:#F6F3EC; padding:28px; border-radius:0 var(--radius) var(--radius) 0;
    display:flex; flex-direction:column;
  }
  @media(max-width:760px){.ticket{border-radius:0 0 var(--radius) var(--radius);}}
  .ticket h2{font-size:12px; text-transform:uppercase; letter-spacing:.12em; font-family:'IBM Plex Mono',monospace; color:#8b8a82; margin-bottom:16px; font-weight:600;}
  .cart-empty{color:var(--dim); font-size:13px; padding:20px 0; font-family:'IBM Plex Mono',monospace;}
  .cart-line{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:10px 0; border-bottom:1px dashed #3a3a38;}
  .cart-line .l-desc{line-height:1.4;}
  .cart-line .l-desc small{display:block; color:#8b8a82; font-family:'IBM Plex Mono',monospace; font-size:11px; margin-top:2px;}
  .cart-line .l-price{font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  .cfg-field-label{font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
  .cfg-swatches{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px;}
  .cfg-swatch{font-size:12px; padding:5px 10px; border:1px solid #cfcabf; border-radius:16px; background:#fff; cursor:pointer;}
  .cfg-swatch.sel{border-color:var(--org-accent); background:var(--org-accent); color:#fff;}
  .cfg-locs{display:flex; flex-direction:column; gap:8px;}
  .cfg-loc-label{display:block; font-size:12px; font-weight:600;}
  .cfg-loc-select,.cfg-ink-select{width:100%; margin-top:3px;}
  .cfg-preview{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .cfg-prev-item{position:relative; width:72px; height:72px;}
  .cfg-prev-item a{display:block; line-height:0;}
  .cfg-prev-item img{width:72px; height:72px; object-fit:contain; border:1px solid #cfcabf; border-radius:8px; transition:opacity .15s ease; cursor:zoom-in;}
  .cfg-prev-item a:hover img{opacity:.85;}
  /* A composed mockup is a full-garment photo — show it larger and whole, not a cropped patch;
     a white background so a photo (typically shot on white) reads cleanly. */
  .cfg-prev-item.cfg-prev-mockup{width:150px; height:170px;}
  .cfg-prev-item.cfg-prev-mockup img{width:150px; height:170px; object-fit:contain; background:#fff;}
  .cfg-prev-badge{position:absolute; left:0; bottom:0; right:0; font-size:10px; text-align:center; background:rgba(0,0,0,.6); color:#fff; border-radius:0 0 8px 8px; padding:1px 0;}
  .cfg-breakdown{margin-top:8px; font-size:12px; color:var(--ink-soft);}
  .cfg-bd-row{display:flex; justify-content:space-between; gap:10px;}
  .remove-x{background:none; border:none; color:#8b8a82; font-size:14px; margin-left:8px;}
  .remove-x:hover{color:#fff;}
  .ticket-total{display:flex; justify-content:space-between; align-items:baseline; padding-top:16px; margin-top:8px; border-top:1px solid #3a3a38;}
  .ticket-total .t-label{font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8b8a82;}
  .ticket-total .t-amount{font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600; color:var(--org-accent);}

  .checkout-fields{margin-top:20px; display:flex; flex-direction:column; gap:10px;}
  .checkout-fields input{background:#0f1012; border:1px solid #3a3a38; color:#F6F3EC;}
  .checkout-fields input::placeholder{color:#6b6a63;}
  .place-order-btn{
    margin-top:16px; background:var(--org-accent); color:var(--org-accent-ink,#fff); border:none; padding:14px; border-radius:var(--radius);
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.08em;
  }
  .place-order-btn:disabled{background:#3a3a38; color:#6b6a63; cursor:not-allowed;}
  .place-order-btn:not(:disabled):hover{filter:brightness(1.08);}
  .form-hint{font-size:11px; color:var(--dim); margin-top:-4px; font-family:'IBM Plex Mono',monospace;}

  .confirmation{
    background:var(--card); color:var(--ink); border-radius:var(--radius); padding:40px 32px; margin:24px 0 60px 0;
  }
  .confirmation .stitch{color:var(--org-accent); margin-bottom:18px;}
  .confirmation h2{font-size:24px;}
  .order-number{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--org-accent); font-weight:600; margin-top:4px;}
  .confirmation p{color:var(--ink-soft); font-size:14px; margin-top:14px; line-height:1.6;}
  .confirmation-back{
    display:inline-block; margin-top:20px; font-family:'IBM Plex Mono',monospace; font-size:12px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--org-accent); text-decoration:none; font-weight:600;
  }

  /* ---- admin ---- */
  .admin-panel{background:var(--card); color:var(--ink); border-radius:var(--radius); padding:28px; margin:8px 0 60px 0;}
  .admin-panel.orders-panel{background:var(--card); border-radius:0; padding:16px 0; margin:0 0 40px;}
  .admin-panel h2{font-size:12px; text-transform:uppercase; letter-spacing:.12em; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); margin-bottom:16px; font-weight:600;}
  .admin-lock{display:flex; gap:8px; max-width:320px;}
  /* The table has more columns than fit in the card's width — without
     this, the overflow renders past the card's cream background onto
     the page's dark background behind it, making that spilled-over text
     unreadable. Scrolling inside this wrapper instead keeps the whole
     table on the card's own background at every scroll position. */
  .admin-table-wrap{max-height:62vh; overflow:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--card-line); border-radius:4px;}
  .admin-table-wrap thead th{position:sticky; top:0; z-index:2; background:var(--card);}
  /* Orders table: capped at half the screen height so its horizontal scrollbar
     is in view below the page header and bulk buttons; rows scroll inside it
     and the header row stays put. */
  .orders-table-wrap{max-height:50vh; overflow:auto; border:1px solid var(--card-line); border-radius:4px;}
  .orders-table-wrap .admin-table{margin-top:0;}
  .orders-table-wrap thead th{position:sticky; top:0; z-index:2; background:var(--card);}
  .admin-table{width:100%; border-collapse:collapse; font-size:12px; font-family:'IBM Plex Mono',monospace; margin-top:6px;}
  .admin-table th{text-align:left; padding:6px 10px; border-bottom:2px solid var(--card-line); color:var(--ink-soft); font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:.05em;}
  .admin-table td{padding:6px 10px; border-bottom:1px solid color-mix(in srgb,var(--card-line) 30%,transparent); vertical-align:top;}
  .admin-empty{color:var(--ink-soft); font-size:13px; padding:20px 0;}
  .admin-actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .admin-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    /* Fall back to --accent when a button sits outside an org panel that sets --org-accent
       (e.g. the Orders filter bar, or the All-shops table) — otherwise the background is
       invalid and the white text lands on the cream panel, unreadable. */
    background:var(--org-accent, var(--accent)); color:var(--org-accent-ink,#fff); border:none; padding:8px 14px; border-radius:var(--radius); font-weight:600;
  }
  /* ---- admin: persistent header (shops + tools) ---- */
  #adminNav{position:sticky; top:0; z-index:900; background:#fff; border-bottom:1px solid var(--card-line); padding:8px 16px; box-shadow:0 1px 4px rgba(0,0,0,.12);}
  /* The per-page header (breadcrumb + title) is redundant with the highlighted menu above,
     so it's removed entirely on admin screens — content sits right under the sticky menu.
     Applied only to admin.js pages (they add .admin-hero); the storefront's .org-hero is
     untouched. */
  .admin-hero{display:none!important;}
  .admin-nav-row{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:2px 0;}
  .admin-nav-label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin:0 4px 0 8px;}
  .admin-nav-btn{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.03em; background:#fff; color:var(--ink); border:1px solid #bbb; border-radius:var(--radius); padding:5px 10px; cursor:pointer;}
  .admin-nav-btn:hover{background:var(--accent-soft);}
  .admin-nav-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .admin-nav-out{margin-left:auto; color:#666;}
  /* Grouped dropdowns so the whole admin menu fits on one line. */
  .admin-nav-group{position:relative; display:inline-block;}
  .admin-nav-drop::after{content:" \25be"; font-size:9px; opacity:.7;}
  .admin-nav-menu{position:absolute; top:calc(100% + 4px); left:0; z-index:950; background:#fff; border:1px solid var(--card-line); border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,.16); min-width:190px; padding:5px; display:none; flex-direction:column; gap:2px;}
  .admin-nav-group.open .admin-nav-menu{display:flex;}
  .admin-nav-menu .admin-nav-btn{display:block; width:100%; text-align:left; border-color:transparent; background:#fff; white-space:nowrap;}
  .admin-nav-menu .admin-nav-btn:hover{background:var(--accent-soft);}
  .admin-nav-menu .admin-nav-btn.active{background:var(--accent); color:#fff;}
  .admin-summary{font-family:'IBM Plex Mono',monospace; font-size:13px; margin-bottom:14px; color:var(--ink-soft);}
  .admin-summary strong{color:var(--ink);}
  textarea.export-box{
    width:100%; margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    padding:10px; border:1px solid var(--card-line); border-radius:var(--radius); min-height:100px;
  }

  /* ---- admin: dynamic catalog forms (create/edit org, create/edit product) ---- */
  .admin-form{display:flex; flex-direction:column; gap:12px; max-width:520px; margin-top:6px;}
  .admin-form label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); display:flex; flex-direction:column; gap:5px;}
  .admin-form input[type=text], .admin-form input[type=email], .admin-form input[type=password], .admin-form input[type=number], .admin-form input[type=url], .admin-form input[type=date], .admin-form textarea, .admin-form select{
    font-family:'IBM Plex Mono', monospace; font-size:13px; border:1px solid var(--card-line);
    background:#fff; color:var(--ink); padding:8px 10px; border-radius:var(--radius); width:100%;
  }
  .admin-form textarea{min-height:70px; resize:vertical;}
  .admin-form .checkbox-row{flex-direction:row; align-items:center; gap:8px;}
  .admin-form .checkbox-row input{width:auto;}
  /* Tick lists inside the product form (blanks, colors): plain rows, not field labels. */
  .admin-form label.pick-row{flex-direction:row; align-items:center; gap:6px; font-family:inherit; font-size:13px; text-transform:none; letter-spacing:0; color:var(--ink);}
  .admin-form label.pick-row input{width:auto; margin:0;}
  .size-price-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(90px,1fr)); gap:10px;}
  .size-price-grid label{gap:3px;}
  .admin-error{color:#b3261e; font-size:13px; margin-top:8px; font-family:'IBM Plex Mono',monospace;}
  .admin-note{color:var(--ink-soft); font-size:12px; margin-top:2px; line-height:1.5;}
  .img-upload{display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap;}
  .img-upload input[type=file]{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);}
  .img-upload-status{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);}

  /* ---- admin: passphrase prompt (masked input, replaces window.prompt()) ---- */
  .bulk-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--card-bg);border:1px solid var(--card-line);border-radius:6px;margin-bottom:8px;}
  .bulk-bar-count{font-weight:600;font-size:13px;min-width:80px;}
  .order-select{width:15px;height:15px;cursor:pointer;accent-color:var(--org-accent,var(--accent));}

  /* ---- admin: cancel / refund states ---- */
  .admin-btn-sm{font-size:11px;padding:3px 8px;}
  tr.item-canceled td{opacity:.55;}
  .canceled-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .cancel-reason{font-size:11px;color:var(--ink-soft);max-width:120px;word-break:break-word;}
  .late-cancel-warn{font-size:11px;color:#b85c00;font-weight:600;cursor:help;}
  .refund-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#1a6a2e;}
  .muted-cell{font-size:11px;color:var(--ink-soft);}

  /* ---- admin: phone layouts (admin.js picks the Orders cards via adminIsMobile_, same 760px) ---- */
  .admin-nav-mobile{display:none;}
  .dsg-layout{display:grid; grid-template-columns:260px 1fr; gap:20px;}
  .dsg-layout #dsgList{max-height:70vh; overflow-y:auto;}
  .dsg-layout #dsgDetail{max-height:75vh; overflow-y:auto;}
  .dsg-back{display:none;}
  .order-cards{display:flex; flex-direction:column; gap:10px;}
  .order-card{background:#fff; color:var(--ink); border:1px solid var(--card-line); border-radius:8px; padding:12px; font-size:14px; line-height:1.4;}
  .oc-head{display:flex; gap:10px; align-items:flex-start;}
  .oc-head .order-select{width:22px; height:22px; margin-top:2px; flex:none;}
  .oc-who{flex:1; min-width:0;}
  .oc-name{font-weight:700; font-size:15px; overflow-wrap:anywhere;}
  .oc-dim{color:var(--ink-soft); font-size:12px;}
  .oc-amt{text-align:right; flex:none;}
  .oc-total{font-weight:700; font-size:15px;}
  .oc-num{white-space:nowrap; font-variant-numeric:tabular-nums;}
  .oc-icon-btn{font-size:12px; padding:2px 7px; margin-left:2px; border:1px solid #ccc; border-radius:4px; background:#fff; color:var(--ink-soft); cursor:pointer;}
  .oc-tag{font-size:10px; font-weight:700; padding:1px 5px; border-radius:3px;}
  .oc-tag-void{background:#fee2e2; color:#b03a2e;}
  .oc-tag-test{background:#e0e7ff; color:#3730a3;}
  .oc-status{margin:8px 0 4px;}
  .oc-chip{display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:#eef3ee; color:#1f4d2e; margin:0 4px 4px 0;}
  .oc-chip br{display:none;}
  .oc-chip-done{background:#dcfce7; color:#166534;}
  .oc-chip-bad{background:#fee2e2; color:#b03a2e;}
  .oc-chip-warn{background:#fef3c7; color:#92400e;}
  .oc-items{list-style:none; margin:6px 0; padding:0; border-top:1px solid #eee;}
  .oc-items li{padding:6px 0; border-bottom:1px solid #eee;}
  .oc-item-main{display:flex; justify-content:space-between; gap:10px;}
  .oc-item-cancelled .oc-item-main{opacity:.55;}
  .oc-item-extra{margin-top:4px;}
  .oc-money, .oc-track{font-size:13px; margin:6px 0;}
  .oc-more{margin:6px 0; font-size:13px;}
  .oc-more summary{cursor:pointer; color:var(--ink-soft); padding:4px 0;}
  .oc-more dl{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:6px 0 0;}
  .oc-more dt{color:var(--ink-soft);}
  .oc-more dd{margin:0;}
  .oc-actions{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .oc-actions > select, .oc-actions > span, .oc-actions > div{flex:1 1 100%; margin:0!important;}
  .oc-actions > select{font-size:15px!important; padding:9px 8px!important;}
  .oc-actions > .admin-btn{flex:1 1 calc(50% - 6px); margin:0!important; padding:10px 8px;}
  .oc-select-all{display:flex; align-items:center; gap:8px; margin:0 0 8px; font-size:14px;}
  .oc-select-all input{width:20px; height:20px;}
  @media (max-width:760px){
    .shell.admin-wide{padding:0 10px;}
    .admin-panel{padding:14px;}
    .admin-panel.orders-panel{padding:8px 0;}
    /* Header: one "☰ Menu" bar; the sheet lists every page, full width. */
    #adminNav{padding:6px 10px;}
    #adminNav .admin-nav-row{display:none;}
    .admin-nav-mobile{display:flex; align-items:center; gap:10px; position:relative;}
    .admin-nav-menu-btn{font-size:14px; padding:8px 14px;}
    .admin-nav-current{font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--ink);}
    .admin-nav-sheet{left:0; right:0; min-width:0; max-height:75vh; overflow-y:auto; padding:8px;}
    .admin-nav-sheet .admin-nav-btn{font-size:14px; padding:10px 12px; white-space:normal;}
    .admin-nav-sheet-group{border-top:1px solid #eee; margin-top:6px; padding-top:6px;}
    .admin-nav-sheet .admin-nav-label{display:block; margin:4px 4px 2px;}
    /* Orders filter bar: full-width shop, dates side by side, bigger tap targets. */
    .orders-filter-bar{display:grid!important; grid-template-columns:1fr 1fr; gap:10px!important;}
    .orders-filter-bar > label:first-child, .orders-filter-bar > div{grid-column:1 / -1;}
    .orders-filter-bar select, .orders-filter-bar input[type=date]{width:100%; min-width:0!important; font-size:15px!important; padding:8px!important; box-sizing:border-box;}
    .orders-filter-bar .checkbox-row{font-size:14px;}
    .orders-filter-bar > .admin-btn{width:100%;}
    /* The bulk bar floats at the bottom of the screen while orders are ticked, scrolling sideways. */
    .bulk-bar{position:fixed; left:8px; right:8px; bottom:8px; z-index:850; flex-wrap:nowrap; overflow-x:auto; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.3); margin:0;}
    .bulk-bar > *{flex:none;}
    #ordBreakdownSection{overflow-x:auto;}
    /* Tables marked .stack-mobile turn into one card per row, labelled by data-label. */
    table.stack-mobile, table.stack-mobile tbody, table.stack-mobile tr, table.stack-mobile td{display:block; width:100%;}
    table.stack-mobile thead{display:none;}
    table.stack-mobile tr{background:#fff; border:1px solid var(--card-line); border-radius:8px; padding:10px 12px; margin-bottom:10px;}
    table.stack-mobile td{border:none!important; padding:2px 0!important; font-size:13px;}
    table.stack-mobile td[data-label]::before{content:attr(data-label) ": "; color:var(--ink-soft); font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
    table.stack-mobile td.stack-title{font-weight:700; font-size:15px; order:-1;}
    table.stack-mobile td.stack-title::before{content:none;}
    table.stack-mobile td.stack-actions{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
    table.stack-mobile td.stack-actions .admin-btn{flex:1 1 auto; margin:0!important; padding:10px;}
    table.stack-mobile tr{display:flex; flex-direction:column;}
    .admin-table-wrap:has(> table.stack-mobile){max-height:none; overflow:visible; border:none;}
    /* Forms: one column, inputs big enough not to trigger iOS zoom. */
    .admin-form{max-width:none;}
    .admin-form input[type=text], .admin-form input[type=email], .admin-form input[type=password], .admin-form input[type=number], .admin-form input[type=url], .admin-form input[type=date], .admin-form textarea, .admin-form select{font-size:16px;}
    .admin-actions .admin-btn{flex:1 1 auto;}
    /* Designs: the list, or the open design — not both squeezed side by side. */
    .dsg-layout{grid-template-columns:1fr; margin:8px 0 40px!important;}
    .dsg-layout #dsgList, .dsg-layout #dsgDetail{max-height:none; overflow:visible;}
    .dsg-layout.dsg-has-open .dsg-list-col{display:none;}
    .dsg-back{display:inline-block; margin-bottom:12px;}
    .dsg-detail-col canvas{width:100%!important; height:auto!important; aspect-ratio:1;}
    /* Product form → Blank links: size | blank | blank size on one line, "Use for all" under it. */
    .blank-links-table thead{display:none;}
    .blank-links-table tr{display:grid; grid-template-columns:44px 1fr 88px; align-items:center; gap:6px; padding:5px 0; border-bottom:1px solid #eee;}
    .blank-links-table td{padding:0!important;}
    .blank-links-table td:empty{display:none;}
    .blank-links-table td:nth-child(4){grid-column:2 / -1;}
    .blank-links-table select{min-width:0!important; width:100%; font-size:15px!important; padding:7px 6px!important;}
  }

  /* ---- print: @page at top level (not inside @media print) so all browsers honor it ---- */
  @page{size:letter;margin:0;}

  /* ---- admin: packing labels (Avery 5160 — 2.625"×1", 3 cols × 10 rows) ----
     Uses CSS `in` units so dimensions are exact at print time.
     Side margins: 0.1875" (3/16"), column gap: 0.125" (1/8"), top margin: 0.5".
     Check: 0.1875×2 + 2.625×3 + 0.125×2 = 0.375 + 7.875 + 0.25 = 8.5" ✓ */
  .label-sheet{
    width:8.5in; box-sizing:border-box;
    padding:0.5in 0.1875in 0 0.1875in;
    display:flex; flex-wrap:wrap; column-gap:0.125in; row-gap:0;
    background:#fff; color:#000;
  }
  .packing-label{
    width:2.625in; height:1in; box-sizing:border-box; overflow:hidden;
    padding:0.06in 0.1in;
    display:flex; flex-direction:column; justify-content:flex-start;
    border:0.5pt dashed #bbb; /* guide line — hidden when printing */
  }
  .packing-label-name{font-family:'Fraunces',serif;font-size:9pt;font-weight:700;line-height:1.2;margin-bottom:1pt;}
  .packing-label-orderid{font-family:'IBM Plex Mono',monospace;font-size:6pt;color:#555;margin-bottom:2pt;letter-spacing:.03em;}
  .packing-label-items{margin:0;padding:0;list-style:none;font-size:7pt;line-height:1.35;font-family:'IBM Plex Sans',sans-serif;}
  .packing-label-items li{padding-left:8pt;position:relative;}
  .packing-label-items li::before{content:"•";position:absolute;left:0;color:#555;}
  .mail-label-name{font-family:'Fraunces',serif;font-size:9.5pt;font-weight:700;line-height:1.2;margin-bottom:2pt;}
  .mail-label-line{font-size:8pt;line-height:1.4;font-family:'IBM Plex Sans',sans-serif;}
  /* Branded labels (Avery 2163 mini-sheet, 4.25"×10", 2 pairs of 2) — on-screen preview */
  .bl-sheet{
    width:4.25in; height:10in; box-sizing:border-box;
    padding:0.25in 0.125in;
    display:flex; flex-direction:column; justify-content:space-between;
    background:#fff; color:#000;
    margin-bottom:16px; /* visual gap between sheets in on-screen preview */
  }
  .bl-pair{display:flex;flex-direction:column;}
  .bl{
    position:relative; width:4in; height:2in; max-height:2in; box-sizing:border-box; overflow:hidden;
    padding:0.1in 0.12in 0.08in 0.12in;
    display:flex; flex-direction:column; flex-shrink:0;
  }
  .bl-content{flex:1;min-width:0;display:flex;flex-direction:column;}
  .bl-top-text{min-height:0.75in;padding-right:calc(0.75in + 8pt);}
  .bl-orgname{font-family:'Fraunces',serif;font-size:10pt;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bl-byline{font-size:6pt;color:#555;font-family:'IBM Plex Sans',sans-serif;margin-top:1pt;}
  .bl-reorder{font-size:6pt;color:#666;font-family:'IBM Plex Sans',sans-serif;letter-spacing:.02em;margin-top:2pt;}
  .bl-gap{height:0.05in;flex-shrink:0;}
  .bl-qr{position:absolute;top:0.1in;right:0.12in;display:block;width:0.75in;height:0.75in;}
  .bl-header-row{display:flex;justify-content:space-between;align-items:baseline;gap:4pt;margin-bottom:1pt;}
  .bl-customer{font-family:'Fraunces',serif;font-size:9pt;font-weight:700;line-height:1.2;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bl-orderid{font-family:'IBM Plex Mono',monospace;font-size:6pt;color:#555;letter-spacing:.03em;flex:0 0 auto;white-space:nowrap;}
  .bl-items{margin:0;padding:0;list-style:none;font-size:7pt;line-height:1.35;font-family:'IBM Plex Sans',sans-serif;}
  .bl-items li{padding-left:8pt;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bl-items li::before{content:"•";position:absolute;left:0;color:#555;}

  .lbl-controls{
    position:sticky; top:0; z-index:100;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    background:#f5f5f5; border-bottom:1px solid #ddd;
    padding:8px 12px; margin:0 0 4px 0;
  }
  .lbl-controls label{font-size:12px; cursor:pointer; display:flex; align-items:center; gap:4px;}

  @media print{
    .no-print,.lbl-controls{display:none!important; visibility:hidden!important;}
    .org-hero,.admin-actions,.bulk-bar,.export-box,.admin-summary,#adminNav{display:none!important;}
    .packing-label,.bl{border:none;}
    body{background:#fff!important;color:#000!important;}
  }

  .breadcrumbs{font-size:12px;font-family:'IBM Plex Mono',monospace;margin-bottom:8px;padding:4px 0;}
  .bc-link{color:var(--org-accent,var(--accent));text-decoration:none;}
  .bc-link:hover{text-decoration:underline;}
  .bc-sep{color:var(--ink-soft);margin:0 4px;}
  .bc-current{color:var(--ink);font-weight:600;}
  .admin-pass-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;
  }
  .admin-pass-box{
    background:var(--card); color:var(--ink); border-radius:var(--radius);
    padding:24px; max-width:320px; width:100%;
    /* Tall prompts scroll inside the box, so Cancel / Submit are always reachable. */
    max-height:calc(100vh - 40px); overflow-y:auto; box-sizing:border-box;
  }
  .admin-pass-box label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-soft); display:block; margin-bottom:8px;
  }
  .admin-pass-box input[type=password]{
    font-family:'IBM Plex Mono', monospace; font-size:14px; border:1px solid var(--card-line);
    background:#fff; color:var(--ink); padding:9px 10px; border-radius:var(--radius); width:100%;
  }
  .admin-pass-actions{display:flex; gap:10px; margin-top:16px; justify-content:flex-end;}
  .admin-pass-actions button{
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    border:none; padding:8px 14px; border-radius:var(--radius); font-weight:600;
  }
  .admin-pass-submit{background:var(--org-accent, var(--accent)); color:#fff;}
  .admin-pass-cancel{background:transparent; color:var(--ink-soft); border:1px solid var(--card-line) !important;}

  /* Visually hidden but still announced by screen readers — used for the
     cart-update aria-live region, which has no visible presence of its
     own (the visible total already updates in the ticket panel). */
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---- toast notifications (replaces alert()) ---- */
  .toast-region{
    position:fixed; top:16px; right:16px; z-index:2000;
    display:flex; flex-direction:column; gap:8px; max-width:340px;
  }
  .toast{
    background:var(--card); color:var(--ink); border-radius:var(--radius);
    padding:12px 14px; font-size:13px; line-height:1.5; cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.35); border-left:3px solid var(--accent);
    white-space:pre-line;
  }
  .toast-error{border-left-color:#b3261e;}

  footer{padding:30px 0 50px 0; color:var(--dim); font-size:12px; font-family:'IBM Plex Mono',monospace;}
  .payment-instructions{
    margin-top:16px; background:#0f1012; border:1px solid #3a3a38;
    border-radius:var(--radius); padding:14px 16px; text-align:left;
  }
  .pi-label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:8px;}
  .pi-value{font-size:14px; color:#F6F3EC; line-height:1.6; margin-bottom:4px;}
  .pi-note{font-size:12px; color:var(--dim); margin-top:6px; line-height:1.5;}
  .pi-discount{font-size:12px; color:#5cb87a; margin-top:8px; font-weight:600;}

  /* ---- order deadline banner ---- */
  .deadline-banner{
    display:flex; align-items:center; gap:10px;
    background:#162619; border-left:3px solid var(--org-accent, #1E7A4C);
    padding:10px 16px; font-size:13px; color:#b9d6bc;
    font-family:'IBM Plex Mono', monospace; border-radius:var(--radius);
    margin:0 0 18px 0;
  }
  .deadline-badge{
    font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    background:var(--org-accent, #1E7A4C); color:var(--org-accent-ink,#fff); padding:2px 7px; border-radius:2px;
    white-space:nowrap; flex-shrink:0;
  }
  .deadline-banner.urgent{ background:#2b1717; border-left-color:#b3261e; color:#f5c2c2; }
  .deadline-banner.urgent .deadline-badge{ background:#b3261e; }
  .deadline-banner.closed{ background:#1e1e1e; border-left-color:#5a5a55; color:var(--dim); }
  .deadline-banner.closed .deadline-badge{ background:#5a5a55; }

  /* ---- shipping / delivery section (inside ticket panel) ---- */
  .shipping-section{margin:14px 0 6px; padding-top:14px; border-top:1px dashed #3a3a38;}
  .shipping-section-label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#8b8a82; margin-bottom:8px;}
  .shipping-option{display:flex; align-items:baseline; gap:8px; font-size:13px; padding:4px 0; cursor:pointer; font-family:'IBM Plex Mono',monospace; line-height:1.4;}
  .shipping-option input[type=radio]{flex-shrink:0; position:relative; top:1px; margin:0; accent-color:var(--org-accent);}
  .shipping-option small{color:#8b8a82; font-size:11px;}
  .shipping-zip-row{margin-top:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .shipping-zip-label{font-size:11px; color:#8b8a82; font-family:'IBM Plex Mono',monospace;}
  .shipping-zip-input{
    font-family:'IBM Plex Mono',monospace; font-size:13px; background:#0f1012;
    border:1px solid #3a3a38; color:#F6F3EC; padding:6px 10px; border-radius:var(--radius);
    width:88px;
  }
  .shipping-zip-input::placeholder{color:#6b6a63;}
  .shipping-manual-notice{margin:8px 0 4px;padding:8px 12px;background:#2a2506;border:1px solid #856b00;border-radius:4px;font-size:12px;color:#e6cc5a;line-height:1.5;font-family:'IBM Plex Mono',monospace;}
  .shipping-loading{font-size:11px; color:#8b8a82; font-family:'IBM Plex Mono',monospace;}
  .ticket-breakdown{padding-top:10px; margin-top:6px; border-top:1px solid #3a3a38;}
  .ticket-breakdown-line{display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:12px; color:#8b8a82; padding:2px 0;}

  /* ---- shipping address modal ---- */
  .ship-addr-overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;}
  .ship-addr-box{background:var(--card); color:var(--ink); border-radius:var(--radius); padding:24px; max-width:400px; width:100%; max-height:calc(100vh - 40px); overflow-y:auto; box-sizing:border-box;}
  .ship-addr-box h2{font-size:16px; margin:0 0 16px;}
  .ship-addr-fields{display:flex; flex-direction:column; gap:10px;}
  .ship-addr-fields input{font-family:'IBM Plex Mono',monospace; font-size:13px; border:1px solid var(--card-line); background:var(--bg); color:var(--ink); padding:8px 10px; border-radius:var(--radius); width:100%; box-sizing:border-box;}
  .ship-addr-row{display:flex; gap:8px;}
  .ship-addr-row .ship-addr-state{flex:0 0 70px; width:70px;}
  .ship-addr-row .ship-addr-zip{flex:0 0 100px; width:100px;}
  .ship-addr-row .ship-addr-city{flex:1;}
  .ship-addr-error{color:#b3261e; font-size:12px; min-height:16px; font-family:'IBM Plex Mono',monospace;}
  .ship-addr-actions{display:flex; gap:10px; margin-top:20px;}
  .ship-addr-cancel{flex:1; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; background:transparent; color:var(--ink-soft); border:1px solid var(--card-line); padding:12px; border-radius:var(--radius); cursor:pointer;}
  .ship-addr-cancel:hover{background:var(--card-line);}
  /* The overlay is appended to <body>, outside the .layout that defines --org-accent, so it sets the
     shop's accent (and a readable text colour for it) on itself — see collectShippingAddress. Without
     that the background was undefined: white text on the cream box. */
  .ship-addr-confirm{flex:2; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; background:var(--org-accent, var(--accent)); color:var(--org-accent-ink, #fff); border:none; padding:12px; border-radius:var(--radius); cursor:pointer;}
  .ship-addr-confirm:hover{filter:brightness(1.08);}

  @media (prefers-reduced-motion: reduce){
    .tag{transition:none;}
  }

  /* Image viewer (storefront "zoom"): near-full-screen, arrows through every picture on the product. */
  .lb-overlay{position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center;}
  .lb-box{position:relative; width:96vw; height:94vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff;}
  .lb-stage{flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center;}
  .lb-img{max-width:100%; max-height:100%; object-fit:contain; background:#fff; border-radius:2px; user-select:none; -webkit-user-drag:none;}
  .lb-cap{padding:10px 56px 0; font-size:14px; text-align:center; min-height:24px;}
  .lb-count{font-family:'IBM Plex Mono',monospace; font-size:12px; opacity:.75; margin-left:8px;}
  .lb-btn{position:absolute; background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:50%; width:48px; height:48px; font-size:26px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .lb-btn:hover,.lb-btn:focus-visible{background:rgba(255,255,255,.32); outline:2px solid #fff;}
  .lb-prev{left:6px; top:50%; transform:translateY(-50%);}
  .lb-next{right:6px; top:50%; transform:translateY(-50%);}
  .lb-close{right:6px; top:6px; font-size:22px;}
  .lb-btn[hidden]{display:none;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><span id="brandName"></span><small>Order Shops</small></div>
  </div>
  <main id="app">
    <noscript>
      <h1>Order shop</h1>
      <p>Custom embroidered and heat-transferred apparel for organizations, teams, and businesses.</p>
      <p>This page needs JavaScript to show the shop.</p>
    </noscript>
    <div id="loadingSkeleton" style="padding:60px 0; text-align:center; color:var(--dim); font-family:'IBM Plex Mono',monospace; font-size:13px;" aria-live="polite" aria-label="Loading…">Loading&hellip;</div>
  </main>
  <footer id="siteFooter"></footer>
</div>

<script>
/* BACKEND: every order and admin call goes to this site's own API (/api/…). The browser never
   talks to any other backend and never holds a secret. */

// Who runs this site — name, contact and how to pay by Venmo / Zelle / check. It comes with every
// /api/catalog answer (Global settings → Business profile in the admin) and is never baked into
// this page. applyBusiness_ puts it into the header, the footer and the title.
const BUSINESS_NAME_FALLBACK = "Our shop";
let business = { name: "", legalName: "", tagline: "", supportEmail: "", mailingAddress: "", venmo: "", zelle: "", footer: "" };
function bizName_(){ return business.name || BUSINESS_NAME_FALLBACK; }
// Where the business is, for address formats only (Global settings → Region; comes with every
// /api/catalog answer). "US": 5-digit ZIP, 2-letter state, the ZIP-vs-state check, carrier rates by
// ZIP. "OTHER": postal code and state / region are free text, and there are no carrier rates.
let siteCountry = "US";
function isUS_(){ return siteCountry !== "OTHER"; }
function applyCountry_(c){ siteCountry = String(c || "").toUpperCase() === "OTHER" ? "OTHER" : "US"; }
// Global settings → Features: which optional parts of the site are on. Arrives with /api/catalog;
// a feature is on unless it was explicitly switched off (so nothing saved = everything on).
let siteFeatures = {};
function applyFeatures_(f){ siteFeatures = (f && typeof f === "object") ? f : {}; }
function featureOn_(key){ return siteFeatures[key] !== false; }
function applyBusiness_(b){
  if(b && typeof b === "object") business = Object.assign({}, business, b);
  VENMO_USERNAME = business.venmo || "";
  const brand = document.getElementById("brandName"); if(brand) brand.textContent = bizName_();
  const foot = document.getElementById("siteFooter");
  if(foot){
    const mail = business.supportEmail ? `Questions? <a href="mailto:${escapeHtml(business.supportEmail)}" style="color:var(--dim);">${escapeHtml(business.supportEmail)}</a>` : "";
    foot.innerHTML = [business.footer ? escapeHtml(business.footer) : "", mail].filter(Boolean).join(" &nbsp;&middot;&nbsp; ");
  }
  if(/^Order shop$/.test(document.title)) document.title = bizName_();
}

// The business's Venmo username, without the @ (Business profile). Used to build a pre-filled
// "Pay with Venmo" link on the confirmation screen when a customer
// selects Venmo — this is a plain deep link (venmo.com/u/...), not an
// API call. Venmo retired their programmatic payment-request API for
// new developers, so nothing can be sent automatically; this just
// saves the customer from typing the amount/note themselves. Blank
// until the profile sets one: the customer is then told they'll be contacted.
let VENMO_USERNAME = "";

// Whether "Credit / Debit Card" shows as a payment option is resolved
// server-side per request (enabledPayments in /api/catalog — see
// functions/api/catalog.js), not by a constant here. The page needs no
// Stripe publishable key: Card checkout redirects to Stripe's hosted
// page, there's no client-side Stripe.js/Elements. Deriving the flag from
// the server's own STRIPE_SECRET_KEY also means a test install running on
// test keys can never create a real charge.

// Set to a number (e.g. 2) to show a note on the checkout screen and
// confirmation email that a discount of that percentage applies to orders
// paid by Check or Zelle (avoiding card processing fees). Set to 0 or
// null to hide the discount mention entirely.
// NOTE: this is informational only — it tells customers about the discount
// but does NOT automatically adjust the order total. Price the discount
// into your catalog pricing, or mention it when collecting payment.
const CASH_DISCOUNT_PERCENT = 0;

/* =========================================================
   No org data lives here at all, on purpose. A static table of every
   org's name/description/accent color would ship in the page source to
   every visitor on every subdomain, so anyone could "view source", read
   the entire client list, then guess at the subdomains directly. Instead
   the client asks functions/api/catalog.js "who am I" on load; the server answers
   using the Host header, and a customer's browser only ever learns
   about the ONE org its own subdomain resolves to. See currentOrg below.
   ========================================================= */

const SIZE_ORDER = ["XS","S","M","L","XL","2XL","3XL","4XL"];   // the standard run
// Every size in display order: the standard run, then the big sizes some styles come in. A product can
// also carry a size that's in neither list (LT, "S/M"…) — productSizes_ puts those last, as given.
const SIZE_ORDER_ALL = SIZE_ORDER.concat(["5XL","6XL"]);
function productSizes_(sizePricing){
  const keys = Object.keys(sizePricing || {});
  const rank = (s) => { const i = SIZE_ORDER_ALL.indexOf(s); return i === -1 ? SIZE_ORDER_ALL.length + keys.indexOf(s) : i; };
  return keys.sort((a, b) => rank(a) - rank(b));
}
const CATEGORY_ORDER = ["shirt","sweatshirt","cap"];
const CATEGORY_LABELS = {shirt:"Shirts", sweatshirt:"Sweatshirts", cap:"Caps"};

// Escapes any customer-supplied text before it's inserted into innerHTML,
// so a submitted name/contact/personalization can never execute as HTML/JS
// in the browser of whoever views it (you, in the Admin panel; or a
// customer, in their own cart preview).
// "#fff" or the page ink, whichever has the higher WCAG contrast on a #rgb/#rrggbb background.
function readableInkOn(hex){
  let h = String(hex || "").replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  if (!/^[0-9a-f]{6}$/i.test(h)) return "#fff";
  const lum = (x) => { const r = [0, 2, 4].map(i => parseInt(x.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
    return 0.2126 * r[0] + 0.7152 * r[1] + 0.0722 * r[2]; };
  const L = lum(h), white = 1.05 / (L + 0.05), ink = (L + 0.05) / (lum("232323") + 0.05);
  return white >= ink ? "#fff" : "#232323";
}

// style="" value for a shop's colour: the colour itself plus a text colour that's readable on it
// (white on dark green, dark ink on a light orange). Buttons filled with the shop colour use
// color:var(--org-accent-ink, #fff).
function orgAccentVars(accent){
  const a = String(accent || "");
  return `--org-accent:${escapeHtml(a)};--org-accent-ink:${readableInkOn(a.trim())}`;
}

function escapeHtml(str){
  if(str == null) return "";
  return String(str).replace(/[&<>"']/g, function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch];
  });
}

// Replaces alert() with a dismissible, non-blocking toast tied to an
// aria-live region — alert() can't be styled, blocks the whole page, and
// its accessible behavior varies across screen readers/browsers in a way
// a real aria-live region doesn't. Auto-dismisses after a few seconds;
// clicking it dismisses immediately too.
function showToast(message, isError){
  let region = document.getElementById("toastRegion");
  if(!region){
    region = document.createElement("div");
    region.id = "toastRegion";
    region.className = "toast-region";
    region.setAttribute("role", "status");
    region.setAttribute("aria-live", "assertive");
    document.body.appendChild(region);
  }
  const toast = document.createElement("div");
  toast.className = "toast" + (isError ? " toast-error" : "");
  toast.textContent = message;
  region.appendChild(toast);
  const dismiss = () => { if(toast.parentNode) toast.parentNode.removeChild(toast); };
  toast.addEventListener("click", dismiss);
  setTimeout(dismiss, 6000);
}

// A quieter, invisible aria-live announcer for routine status changes
// (cart updates) that don't warrant a visible toast — the visible cart
// total already updates on screen; this just makes sure a screen reader
// user hears the same change, not just sighted users.
function announceStatus(message){
  let region = document.getElementById("statusRegion");
  if(!region){
    region = document.createElement("div");
    region.id = "statusRegion";
    region.className = "sr-only";
    region.setAttribute("role", "status");
    region.setAttribute("aria-live", "polite");
    document.body.appendChild(region);
  }
  region.textContent = message;
}

// Maps a full-size LOCAL image path to its small, fast-loading thumbnail —
// e.g. "images/polo-a-front.jpg" -> "images/thumbs/polo-a-front.jpg".
// The page always displays the thumbnail; clicking still opens the
// full-size original (see the <a href> wrapping each thumbnail below).
// Admin-supplied external URLs (http[s]://...) are returned unchanged —
// there's no local /thumbs/ variant of an off-site image, so rewriting
// the path would just produce a dead link.
function thumbUrl(fullPath){
  if(!fullPath) return fullPath;
  // Normalize bare-domain URLs (missing https:// scheme) so they aren't
  // treated as relative paths by the browser.
  if(!/^https?:\/\//i.test(fullPath) && !fullPath.startsWith('/')){
    const firstSlash = fullPath.indexOf('/');
    const hostPart = firstSlash === -1 ? fullPath : fullPath.slice(0, firstSlash);
    if(hostPart.includes('.') && !hostPart.startsWith('.')) fullPath = 'https://' + fullPath;
  }
  if(/^https?:\/\//i.test(fullPath)){
    // R2 uploads are stored under /uploads/ with a paired -thumb variant
    // uploaded at 320px by uploadImage(). External URLs have no thumbnail
    // and pass through unchanged.
    if(fullPath.indexOf("/uploads/") !== -1){
      return fullPath.replace(/(\.[^./?#]+)(\?[^#]*)?(#.*)?$/, "-thumb$1$2$3");
    }
    return fullPath;
  }
  const parts = fullPath.split("/");
  const filename = parts.pop();
  const base = filename.replace(/\.[^.]+$/, "");
  return parts.join("/") + "/thumbs/" + base + ".jpg";
}

/* ---------------- routing (pure JS state — no URL/hash navigation,
   so nothing here is ever mistaken for a real link) ---------------- */
let route = {view:"generic"};
let currentOrgId = null;

// The ONE org this browser is entitled to see this session — populated
// once at boot from /api/catalog, which resolves identity from the
// request's Host header server-side. null on the root/generic domain
// or an unrecognized host; this session then never learns any org exists.
let currentOrg = null;

async function resolveCurrentOrg(){
  try{
    const res = await fetch("/api/catalog");
    if(!res.ok){ try{ const d = await res.json(); applyBusiness_(d.business); applyCountry_(d.country); applyFeatures_(d.features); }catch(e){} return null; }
    const data = await res.json();
    applyBusiness_(data.business);
    applyCountry_(data.country);
    applyFeatures_(data.features);
    if(data.status === "admin") return {admin:true};
    // Global settings → Features → Storefront is off: no shop is served here (see catalog.js).
    if(data.status === "closed") return {closed:true};
    if(data.status !== "ok") return null;
    return Object.assign({orgId: data.orgId}, data.catalog);
  }catch(e){
    console.error("Could not resolve current org:", e);
    return null;
  }
}

// Lazily loads admin.js — the admin panel (org/product management, order
// lookup, image uploads) is a large script used by nobody except the admin
// subdomain, so it isn't shipped to every storefront visitor. Loaded via
// a real <script src> tag (not fetch()+eval()) so it never needs
// 'unsafe-eval' in the CSP (see _headers) — a classic script's top-level
// let/const/function declarations attach to the same shared global script
// scope as this file's own, so admin.js's functions (renderAdminPicker,
// etc.) become callable here exactly as if they'd always been in this
// file. Cached after the first successful load — every subsequent call
// (there's only ever one entry point, but this stays safe if that changes)
// reuses the same promise instead of injecting a second <script> tag.
let adminScriptPromise = null;
function loadAdminScript(){
  if(adminScriptPromise) return adminScriptPromise;
  adminScriptPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "admin.js?v=" + Date.now();
    s.onload = resolve;
    s.onerror = () => { adminScriptPromise = null; reject(new Error("Could not load admin.js")); };
    document.head.appendChild(s);
  });
  return adminScriptPromise;
}

function go(view, orgId){
  // This site only ever shows the one org currentOrg resolved to at
  // boot — there is no other org or hub to navigate to.
  if(currentOrg){
    orgId = currentOrg.orgId;
  }
  route = orgId ? {view, org:orgId} : {view};
  render();
}

/* ---------------- cart state (per org, in-memory) ---------------- */
let cart = [];
let activeCatalog = null; // currentOrg's own products/pricing — never contains other orgs' data

// Shipping state — only meaningful when the shop offers shipping (offersShipping_).
// null shippingQuote = "Local delivery" (free, default). A non-null value is
// one of the objects returned by /api/shipping and selected by the customer.
let shippingZip = "";
let shippingRates = [];    // rates fetched from /api/shipping (up to 3)
let shippingQuote = null;  // null = local delivery; {provider,service,amount,estimatedDays} = carrier
let shippingManual = false; // true when order doesn't fit a known box — no rates shown, admin follows up
// Delivery choice (the shop's list: local pickup, carrier shipping, its own flat-fee options).
// deliveryOptId = the picked pickup/custom option (null = the first one offered); a carrier rate lives
// in shippingQuote and wins while set; shippingManualPicked = "ship it, quote to follow" is chosen.
let deliveryOptId = null;
let shippingManualPicked = false;
function deliveryOptions_(org){
  if(org && Array.isArray(org.deliveryOptions) && org.deliveryOptions.length) return org.deliveryOptions;
  // A catalog answer without the list: free local pickup, plus shipping when enabled.
  return [{id:"pickup", type:"pickup", label:"Local pickup", fee:0}].concat(org && org.shippingEnabled ? [{id:"shipping", type:"shipping", label:"Shipping", fee:null}] : []);
}
function offersShipping_(org){ return deliveryOptions_(org).some(o => o.type === "shipping"); }
// What's chosen right now → {kind: "quote"|"manual"|"option"|"none", fee, label, option}.
function currentDelivery_(org){
  if(offersShipping_(org) && shippingQuote) return {kind:"quote", fee:shippingQuote.amount, label:shippingQuote.provider + " " + shippingQuote.service};
  if(offersShipping_(org) && shippingManual && shippingManualPicked) return {kind:"manual", fee:0, label:"Shipping — quote to follow"};
  const choices = deliveryOptions_(org).filter(o => o.type !== "shipping");
  const o = choices.find(x => x.id === deliveryOptId) || choices[0];
  return o ? {kind:"option", option:o, fee:Number(o.fee) || 0, label:o.label} : {kind:"none", fee:0, label:""};
}
let shippingLoading = false;
let shippingDebounce = null;

function priceFor(product, size){
  if(product.type === "cap") return product.flatPrice;
  return product.sizePricing[size];
}

function render(){
  const app = document.getElementById("app");
  document.querySelector(".shell").classList.toggle("admin-wide", route.view === "admin");

  // The admin subdomain has no org of its own — handle it before the
  // "no org resolved" fallback below would otherwise catch it. admin.js
  // is loaded on demand (see loadAdminScript() above) — show a minimal
  // loading state immediately, then swap in the real picker once it's
  // ready. If it were already loaded (adminScriptPromise resolved), this
  // still resolves on the same tick before the next paint, so there's no
  // visible flash for a warm reload.
  if(route.view === "admin"){
    app.innerHTML = `<div class="admin-summary">Loading&hellip;</div>`;
    loadAdminScript()
      .then(() => adminRoute())
      .catch((err) => {
        console.error("Could not load admin.js:", err);
        app.innerHTML = `<div class="admin-empty">Could not load the admin panel. Please refresh and try again.</div>`;
      });
    return;
  }

  // Design verification page — token-gated, works on any subdomain (or even
  // the root domain); doesn't need currentOrg resolved.
  if(route.view === "design-verify"){ renderDesignVerify(app, route.token); return; }

  // Storefront switched off: the same short page on every shop address and the main one.
  if(route.view === "closed"){ currentOrgId = null; renderStorefrontOff(app, route); return; }

  // No org resolved (root/generic domain, or an unrecognized host) —
  // or route.org somehow doesn't match the one org this session knows
  // about. Either way, show the generic page; there's nothing else to show.
  if(route.view === "generic" || !currentOrg || route.org !== currentOrg.orgId){
    currentOrgId = null;
    route = {view:"generic"};
    renderGenericFallback(app);
    return;
  }

  if(route.view === "stripe-success"){ renderStripeSuccess(app, currentOrg.orgId, currentOrg, route.orderId); return; }

  // org order page — reset cart and shipping state when switching to a *different* org
  if(currentOrgId !== currentOrg.orgId){
    clearCart_();
    currentOrgId = currentOrg.orgId;
    shippingZip = ""; shippingRates = []; shippingQuote = null; shippingLoading = false; shippingManual = false; deliveryOptId = null; shippingManualPicked = false;
    if(shippingDebounce){ clearTimeout(shippingDebounce); shippingDebounce = null; }
  }
  renderOrgPage(app, currentOrg.orgId, currentOrg);
}

function renderStripeSuccess(app, orgId, org, orderId){
  document.title = org.name + " — Payment confirmed";
  app.innerHTML = `
    <div class="confirmation" style="${orgAccentVars(org.accent)}">
      <div class="stitch"></div>
      <h2>Payment confirmed!</h2>
      <div class="order-number">${escapeHtml(orderId || "")}</div>
      <p>Your card payment was processed successfully. Your order has been recorded for ${escapeHtml(org.name)} and is marked paid.</p>
      <p>You'll receive a Stripe receipt by email. Reach out if you have any questions about your order.</p>
      <br>
      <button class="confirmation-back" data-action="go-org" data-org="${orgId}" style="background:none; border:none; margin-top:12px;">&larr; Back to ${escapeHtml(org.name)}</button>
    </div>
  `;
}

async function renderDesignVerify(app, token){
  document.title = "Design Verification";
  app.innerHTML = `<div style="padding:40px;text-align:center;font-family:system-ui,sans-serif;color:#555;">Loading your design…</div>`;
  let data;
  try{
    const res = await fetch("/api/verify?token=" + encodeURIComponent(token));
    data = await res.json();
  }catch{
    app.innerHTML = `<div style="padding:40px;text-align:center;font-family:system-ui,sans-serif;color:#b03a2e;">Could not load design verification. Please check your link or contact us.</div>`;
    return;
  }
  if(data && data.status === "unavailable"){
    // Design approval is switched off for this site: say so plainly (it isn't a broken link).
    app.innerHTML = `<div style="padding:40px;text-align:center;font-family:system-ui,sans-serif;color:#555;">${escapeHtml(data.message || "Design approval isn't available right now. Please contact us about your order.")}</div>`;
    return;
  }
  if(!data || data.status !== "ok"){
    app.innerHTML = `<div style="padding:40px;text-align:center;font-family:system-ui,sans-serif;color:#b03a2e;">This verification link is invalid or has expired.</div>`;
    return;
  }

  document.title = "Design Verification — " + data.orderId;
  const accent = data.orgAccent || "#1d4ed8";
  const alreadyResponded = data.verificationStatus !== "pending";

  const imagesHtml = (data.imageUrls || []).filter(Boolean).map(
    u => `<div style="margin:12px 0;"><img src="${escapeHtml(u)}" alt="Design image" style="max-width:100%;border-radius:6px;border:1px solid #e5e7eb;"></div>`
  ).join("");

  const respondedBanner = alreadyResponded ? `
    <div style="background:${data.verificationStatus==='approved'?'#dcfce7':'#fef3c7'};border:1px solid ${data.verificationStatus==='approved'?'#86efac':'#fcd34d'};border-radius:6px;padding:14px 18px;margin-bottom:24px;font-size:14px;color:#1a1a1a;">
      <strong>${data.verificationStatus === 'approved' ? '✓ You approved this design' : '⚠ You requested revisions'}</strong>
      ${data.respondedAt ? ` on ${new Date(data.respondedAt).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}` : ""}
      ${data.customerNote ? `<br><span style="color:#555">Your note: ${escapeHtml(data.customerNote)}</span>` : ""}
    </div>` : "";

  app.innerHTML = `
    <div style="max-width:620px;margin:0 auto;padding:32px 20px;font-family:system-ui,sans-serif;color:#1a1a1a;">
      <div style="font-size:22px;font-weight:700;color:${escapeHtml(accent)};margin-bottom:4px;">${escapeHtml(data.orgName)}</div>
      <div style="font-size:13px;color:#555;margin-bottom:24px;">Design verification for order <strong>${escapeHtml(data.orderId)}</strong></div>
      ${respondedBanner}
      <div style="font-size:15px;line-height:1.6;white-space:pre-wrap;margin-bottom:20px;">${escapeHtml(data.message)}</div>
      ${imagesHtml}
      ${alreadyResponded ? "" : `
        <div id="dvFormArea" style="margin-top:28px;border-top:1px solid #e5e7eb;padding-top:24px;">
          <div style="font-size:16px;font-weight:700;margin-bottom:16px;">Your response</div>
          <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
            <button id="dvApproveBtn" onclick="dvSelectAction('approved')" style="flex:1;min-width:140px;padding:14px 20px;border-radius:6px;border:2px solid #e5e7eb;background:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;">
              ✓ Approve design
            </button>
            <button id="dvRevisionBtn" onclick="dvSelectAction('revision')" style="flex:1;min-width:140px;padding:14px 20px;border-radius:6px;border:2px solid #e5e7eb;background:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;">
              ✏ Request changes
            </button>
          </div>
          <div id="dvRevisionArea" style="display:none;margin-bottom:16px;">
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px;">Describe the changes needed <span style="color:#b03a2e">*</span></label>
            <textarea id="dvNote" rows="4" placeholder="Please be as specific as possible about what needs to change." style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px;font-family:inherit;resize:vertical;"></textarea>
            <div style="margin-top:12px;font-size:13px;font-weight:600;margin-bottom:6px;">Supporting images (optional)</div>
            ${[1,2].map(i => `
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
                <input type="text" id="dvCustImg${i}" placeholder="https://... or upload below" style="flex:1;padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px;">
                <label style="cursor:pointer;font-size:12px;padding:5px 10px;background:#e5e7eb;border-radius:4px;white-space:nowrap;">
                  Upload <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none;" data-target="dvCustImg${i}" data-token="${escapeHtml(token)}" onchange="handleCustVerifyUpload(this)">
                </label>
                <span id="dvCustImg${i}Status" style="font-size:11px;color:#555;min-width:50px;"></span>
              </div>`).join("")}
          </div>
          <div id="dvError" style="color:#b03a2e;font-size:13px;min-height:18px;margin-bottom:8px;"></div>
          <button id="dvSubmit" onclick="dvSubmitResponse('${escapeHtml(token)}')" style="display:none;padding:12px 28px;background:${escapeHtml(accent)};color:#fff;border:none;border-radius:5px;font-size:15px;font-weight:600;cursor:pointer;width:100%;">Submit response</button>
        </div>
      `}
    </div>`;

  window._dvAction = null;

  window.dvSelectAction = function(action){
    window._dvAction = action;
    const approveBtn = document.getElementById("dvApproveBtn");
    const revisionBtn = document.getElementById("dvRevisionBtn");
    const revArea = document.getElementById("dvRevisionArea");
    const submitBtn = document.getElementById("dvSubmit");
    const activeStyle = "border-color:" + accent + ";background:" + accent + ";color:#fff;";
    const inactiveStyle = "border-color:#e5e7eb;background:#fff;color:#1a1a1a;";
    if(action === "approved"){
      approveBtn.style.cssText = approveBtn.style.cssText.replace(/border-color[^;]*;background:[^;]*;color:[^;]*;/g,"") + activeStyle;
      revisionBtn.style.cssText = revisionBtn.style.cssText.replace(/border-color[^;]*;background:[^;]*;color:[^;]*;/g,"") + inactiveStyle;
      revArea.style.display = "none";
    } else {
      revisionBtn.style.cssText = revisionBtn.style.cssText.replace(/border-color[^;]*;background:[^;]*;color:[^;]*;/g,"") + activeStyle;
      approveBtn.style.cssText = approveBtn.style.cssText.replace(/border-color[^;]*;background:[^;]*;color:[^;]*;/g,"") + inactiveStyle;
      revArea.style.display = "block";
    }
    submitBtn.style.display = "block";
    document.getElementById("dvError").textContent = "";
  };

  window.handleCustVerifyUpload = async function(input){
    const targetId = input.dataset.target;
    const tok = input.dataset.token;
    const statusEl = document.getElementById(targetId + "Status");
    const file = input.files && input.files[0];
    if(!file) return;
    statusEl.textContent = "Uploading…";
    try{
      const res = await fetch("/api/upload-verify?token=" + encodeURIComponent(tok), {
        method:"POST", headers:{"Content-Type":file.type}, body:file
      });
      const d = await res.json();
      if(!res.ok || d.status !== "ok") throw new Error(d.message || "Upload failed");
      document.getElementById(targetId).value = d.url;
      statusEl.textContent = "✓";
    }catch(e){
      statusEl.textContent = "Failed";
    }
  };

  window.dvSubmitResponse = async function(tok){
    const action = window._dvAction;
    if(!action){ document.getElementById("dvError").textContent = "Please choose Approve or Request changes."; return; }
    const note = action === "revision" ? (document.getElementById("dvNote")||{}).value?.trim() : "";
    if(action === "revision" && !note){ document.getElementById("dvError").textContent = "Please describe the changes needed."; return; }
    const imageUrls = [1,2].map(i => {
      const el = document.getElementById("dvCustImg"+i);
      return el ? el.value.trim() : "";
    }).filter(Boolean);

    const submitBtn = document.getElementById("dvSubmit");
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting…";
    document.getElementById("dvError").textContent = "";

    try{
      const res = await fetch("/api/verify", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({token:tok, action, note, imageUrls})
      });
      const d = await res.json();
      if(!res.ok || d.status !== "ok") throw new Error(d.message || "Could not submit response");
      document.getElementById("dvFormArea").innerHTML = `
        <div style="background:${action==='approved'?'#dcfce7':'#fef3c7'};border:1px solid ${action==='approved'?'#86efac':'#fcd34d'};border-radius:6px;padding:18px;font-size:15px;color:#1a1a1a;text-align:center;">
          <div style="font-size:20px;margin-bottom:6px;">${action==='approved'?'✓ Design approved!':'⚠ Revision request sent'}</div>
          <div style="font-size:14px;color:#555;">${action==='approved'?'Thank you! We\'ll proceed with your order.':'We\'ll review your feedback and be in touch.'}</div>
        </div>`;
    }catch(e){
      document.getElementById("dvError").textContent = e.message || "Could not submit response.";
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit response";
    }
  };
}
